name: jujo_stream_app
description: Jujo.Stream Server management app — streaming configuration, game library, device pairing, and telemetry.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP & Networking
  dio: ^5.7.0
  crypto: ^3.0.6

  # Models & Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # UI Components
  lucide_icons: ^0.257.0
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0

  # Desktop window management
  window_manager: ^0.4.3

  # File picker
  file_picker: ^8.1.7

  # Utilities
  intl: ^0.19.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/platforms/
    - assets/login_modal/
    - assets/icons/
