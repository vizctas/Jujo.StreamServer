name: Build & Release Server

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $wixDir = "C:\Program Files (x86)\WiX Toolset v3.14"
          New-Item -ItemType Directory -Path $wixDir -Force | Out-Null
          Write-Host "Downloading WiX v3.14..."
          Invoke-WebRequest -Uri $wixUrl -OutFile "$env:TEMP\wix.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\wix.zip" -DestinationPath $wixDir -Force
          Write-Host "Adding WiX to PATH..."
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSYS2 (build deps)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-zlib

      - name: Add MSYS2 ucrt64 to PATH
        shell: pwsh
        run: |
          $msysBin = "C:\msys64\ucrt64\bin"
          if (Test-Path $msysBin) {
            Write-Host "Adding $msysBin to PATH"
            echo "$msysBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "WARNING: $msysBin not found"
          }

      - name: Resolve pkg-config executable
        id: pkgconfig
        shell: msys2 {0}
        run: |
          echo "=== which pkgconf ==="
          PKG=$(which pkgconf 2>/dev/null || which pkg-config 2>/dev/null || echo "")
          if [ -z "$PKG" ]; then
            echo "ERROR: pkgconf not found in PATH"
            echo "=== Installed pkgconf packages ==="
            pacman -Q 2>/dev/null | grep -i pkgconf || echo "(none)"
            echo "=== /ucrt64/bin pkg* files ==="
            ls /ucrt64/bin/ 2>/dev/null | grep -i pkg || echo "(none)"
            exit 1
          fi
          WIN_PKG=$(cygpath -w "$PKG")
          WIN_PREFIX=$(cygpath -w /ucrt64)
          echo "Found pkgconf: $WIN_PKG"
          echo "MSYS2 ucrt64 prefix: $WIN_PREFIX"
          echo "exe=$WIN_PKG" >> "$GITHUB_OUTPUT"
          echo "prefix=$WIN_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Verify MSYS2 deps
        shell: pwsh
        run: |
          Write-Host "PATH contains:"
          $env:PATH -split ';' | Select-String 'msys64' | ForEach-Object { Write-Host "  $_" }
          $pkgConfig = "${{ steps.pkgconfig.outputs.exe }}"
          Write-Host "Using pkg-config: $pkgConfig"
          & "$pkgConfig" --version
          Write-Host "Available .pc files:"
          & "$pkgConfig" --list-all | Select-String -Pattern 'curl|miniupnpc|MinHook'

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure CMake
        shell: pwsh
        run: |
          $pkgConfigExe = "${{ steps.pkgconfig.outputs.exe }}"
          $msys2Prefix  = "${{ steps.pkgconfig.outputs.prefix }}"
          if (-not (Test-Path $pkgConfigExe)) {
            throw "pkg-config executable not found: $pkgConfigExe"
          }
          Write-Host "CMake will use PKG_CONFIG_EXECUTABLE=$pkgConfigExe"
          Write-Host "CMake will use CMAKE_PREFIX_PATH=$msys2Prefix"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_PREFIX_PATH="$msys2Prefix" `
            -DPKG_CONFIG_EXECUTABLE="$pkgConfigExe" `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++

      - name: Build sunshine.exe
        shell: pwsh
        run: |
          cmake --build build --target sunshine -j 4

      - name: Package MSI via CPack
        shell: pwsh
        run: |
          cpack -B build/cpack_artifacts --config build/CPackConfig.cmake

      - name: Build Bootstrapper EXE
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "build"
          & "packaging/windows/bootstrapper/build_bootstrapper.ps1" -BuildDir $buildDir.Path

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse build/cpack_artifacts/ | Select-Object Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-installer
          path: |
            build/cpack_artifacts/JujoStreamServerSetup.exe
            build/cpack_artifacts/*.msi

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: server-installer
          path: artifacts/

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Publish release to Jujo.StreamServer.Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Creating release $tag in vizctas/Jujo.StreamServer.Releases..."
          $assets = @()
          if (Test-Path "artifacts/JujoStreamServerSetup.exe") {
            $assets += "artifacts/JujoStreamServerSetup.exe"
          }
          Get-ChildItem "artifacts/*.msi" | ForEach-Object {
            $assets += $_.FullName
          }
          gh release create $tag `
            $assets `
            --repo vizctas/Jujo.StreamServer.Releases `
            --title $tag `
            --generate-notes
