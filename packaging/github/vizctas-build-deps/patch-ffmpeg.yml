name: Patch Windows FFmpeg

on:
  workflow_dispatch:

jobs:
  build-windows-ffmpeg:
    name: Build Windows-AMD64 FFmpeg
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout master (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            base-devel
            git
            make
            patch
            pkg-config
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-onevpl

      - name: Remove stale C:\msys64 redirector
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\msys2_shell.cmd") {
            Remove-Item -Force "C:\msys64\msys2_shell.cmd"
          }

      - name: Get processor count
        id: cpu
        shell: bash
        run: echo "COUNT=$(nproc)" >> "${GITHUB_OUTPUT}"

      - name: Configure
        env:
          MSYS2_ROOT: ${{ runner.temp }}\msys64
        run: |
          set -e
          export PATH="$MSYS2_ROOT/usr/bin:$MSYS2_ROOT:$PATH"
          mkdir -p ./build/dist
          cmake \
            -B build \
            -S . \
            -G "MSYS Makefiles" \
            -DBUILD_ALL=OFF \
            -DBUILD_FFMPEG=ON \
            -DBUILD_FFMPEG_CUDA_LLVM=OFF \
            "-DCMAKE_INSTALL_PREFIX=$(pwd)/build/dist" \
            -DPARALLEL_BUILDS=${{ steps.cpu.outputs.COUNT }}

      - name: Build
        run: make -C build --jobs=${{ steps.cpu.outputs.COUNT }}

      - name: Install
        run: make -C build install

      # ── Restructure: StreamServer expects lib/include directly under platform dir
      #    build-deps installs to <prefix>/ (== build/dist/ffmpeg/) but
      #    StreamServer's cmake looks for dist/Windows-AMD64/{lib,include}/.
      - name: Restructure for StreamServer cmake
        run: |
          set -e
          mkdir -p build/dist-final/Windows-AMD64
          cp -r build/dist/ffmpeg/include build/dist-final/Windows-AMD64/include
          mkdir -p build/dist-final/Windows-AMD64/lib
          cp -r build/dist/ffmpeg/lib/*.a build/dist-final/Windows-AMD64/lib/
          cp -r build/dist/ffmpeg/lib/cmake build/dist-final/Windows-AMD64/lib/cmake 2>/dev/null || true
          cp -r build/dist/ffmpeg/lib/pkgconfig build/dist-final/Windows-AMD64/lib/pkgconfig 2>/dev/null || true
          echo "Final dist structure:"
          find build/dist-final/Windows-AMD64 -type f | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-AMD64-ffmpeg-patched
          path: ./build/dist-final/Windows-AMD64

      - name: Checkout dist branch into subfolder
        shell: bash
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin dist; then
            git clone --branch dist --depth 1 \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              dist-repo
          else
            mkdir dist-repo
            cd dist-repo
            git init
            git remote add origin \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan dist
            touch .keep
            git add .keep
            git commit -m "chore: init dist orphan branch"
          fi

      - name: Overwrite Windows-AMD64 in dist
        shell: bash
        run: |
          mkdir -p dist-repo/dist/Windows-AMD64
          rm -rf dist-repo/dist/Windows-AMD64/include
          rm -rf dist-repo/dist/Windows-AMD64/lib
          cp -r build/dist-final/Windows-AMD64/include dist-repo/dist/Windows-AMD64/include
          cp -r build/dist-final/Windows-AMD64/lib dist-repo/dist/Windows-AMD64/lib

      - name: Commit and push to dist
        shell: bash
        run: |
          cd dist-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build(dist): patch Windows-AMD64 FFmpeg (AMF multi_hw_instance_encode)"
            git push origin HEAD:dist --force
          fi
